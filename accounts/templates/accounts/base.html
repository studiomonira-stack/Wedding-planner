<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bröllopsplaneraren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F3EE;
            --primary: #C7BDAE;
            --hover: #B4A390;
            --text-light: #997D64;
            --text-dark: #634935;
            --white: #ffffff;
            --border: #e5e3dc;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
        }
        h1, h2, h3, h4, h5, .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-dark);
        }
        .navbar {
            background: var(--white) !important;
            border-bottom: 1px solid var(--border);
        }
        .btn-outline-secondary {
            border-color: var(--primary);
            color: var(--text-light);
            background: transparent;
            font-size: 0.8rem;
            padding: 4px 10px;
        }
        .btn-outline-secondary:hover {
            background: var(--hover);
            border-color: var(--hover);
            color: white;
        }
        .btn-outline-danger {
            border-color: #d4a5a5;
            color: #b06060;
            font-size: 0.8rem;
            padding: 4px 10px;
        }
        .btn-outline-danger:hover {
            background: #b06060;
            color: white;
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--text-dark);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--hover);
            border-color: var(--hover);
            color: white;
        }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(99,73,53,0.04);
        }
        .card h5 {
            color: var(--text-dark);
        }
        .table {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
        }
        .table th {
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-dark);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--hover);
            box-shadow: 0 0 0 0.2rem rgba(180,163,144,0.25);
        }
        .progress {
            background: var(--bg);
        }
        .progress-bar {
            background: var(--primary);
            color: var(--text-dark);
        }
        a {
            color: var(--text-light);
        }
        a:hover {
            color: var(--text-dark);
        }
        .badge {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light px-4">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="fas fa-gem"></i> Bröllopsplaneraren</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'checklist' %}" class="btn btn-outline-secondary btn-sm me-1"><i class="fas fa-list-check"></i> Checklista</a>
                <a href="{% url 'budget' %}" class="btn btn-outline-secondary btn-sm me-1"><i class="fas fa-coins"></i> Budget</a>
                <a href="{% url 'gastlista' %}" class="btn btn-outline-secondary btn-sm me-1"><i class="fas fa-envelope-open-text"></i> Gäster</a>
                <a href="{% url 'leverantorer' %}" class="btn btn-outline-secondary btn-sm me-1"><i class="fas fa-truck"></i> Leverantörer</a>
                <a href="{% url 'tidslinje' %}" class="btn btn-outline-secondary btn-sm me-1"><i class="fas fa-clock"></i> Tidslinje</a>
                <a href="{% url 'galleri' %}" class="btn btn-outline-secondary btn-sm me-3"><i class="fas fa-images"></i> Galleri</a>
                <span class="me-2">Hej {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logga ut</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Logga in</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
