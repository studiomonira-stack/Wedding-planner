<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bröllopsplaneraren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
               <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
        <a class="navbar-brand" href="{% url 'dashboard' %}"><i class="fas fa-gem"></i> Bröllopsplaneraren</a>
        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'checklist' %}" class="btn btn-outline-secondary btn-sm me-2"> <i class="fas fa-list-check"></i> Checklista</a>
                <a href="{% url 'budget' %}" class="btn btn-outline-secondary btn-sm me-2"> <i class="fas fa-coins"></i> Budget</a>
                <a href="{% url 'gastlista' %}" class="btn btn-outline-secondary btn-sm me-2"><i class="fas fa-envelope-open-text"></i> Gäster</a>
                <a href="{% url 'leverantorer' %}" class="btn btn-outline-secondary btn-sm me-2"> <i class="fas fa-truck"></i> Leverantörer</a>
                <a href="{% url 'tidslinje' %}" class="btn btn-outline-secondary btn-sm me-2"> <i class="fas fa-clock"></i> Tidslinje</a>
                <a href="{% url 'galleri' %}" class="btn btn-outline-secondary btn-sm me-3"> <i class="fas fa-images"></i> Galleri</a>
                <span class="me-2">Hej {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Logga ut</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Logga in</a>
            {% endif %}
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
