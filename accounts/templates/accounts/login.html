{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2LKM96TXGF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Logga in – Bröllopsplaneraren" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #F7F4EF;
            --surface: #F0E8DD;
            --white: #FFFFFF;
            --primary: #C8A26B;
            --primary-dark: #B08C58;
            --primary-light: #E4D3B8;
            --text: #3D3A37;
            --text-light: #6A6662;
            --text-muted: #A69B8E;
            --border: #E8E0D5;
            --shadow: rgba(61, 58, 55, 0.06);
            --shadow-hover: rgba(61, 58, 55, 0.12);
        }
        body {
            font-family: 'Karla', sans-serif;
            background: var(--background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text);
            font-weight: 400;
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 2px 20px var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
        }
        .btn-primary {
            background: var(--primary);
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-weight: 400;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
            font-family: 'Karla', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(176,140,88,0.3);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            font-family: 'Karla', sans-serif;
            font-size: 0.9rem;
            background: var(--white);
            transition: all 0.3s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(200,162,107,0.1);
        }
        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            color: var(--primary-dark);
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: var(--text);
            text-decoration: none;
            font-weight: 400;
        }
        .navbar-brand i {
            color: var(--primary);
        }
        .text-muted {
            color: var(--text-muted) !important;
        }
        .alert-danger {
            background: #FBF9F6;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            font-size: 0.85rem;
        }
        .form-label {
            color: var(--text-light);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="{% url 'landing' %}" class="navbar-brand">
                <i class="fas fa-gem me-2"></i>{% trans "Bröllopsplaneraren" %}
            </a>
        </div>
        <h2 class="text-center mb-1">{% trans "Välkommen tillbaka" %}</h2>
        <p class="text-center text-muted small mb-4">{% trans "Logga in för att fortsätta planeringen" %}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">{% trans "Användarnamn" %}</label>
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Ditt användarnamn' %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% trans "Lösenord" %}</label>
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Ditt lösenord' %}" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger small">{% trans "Fel användarnamn eller lösenord." %}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary mt-2">{% trans "Logga in" %}</button>
        </form>

    </div>

</body>
</html>
