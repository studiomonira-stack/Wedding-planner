{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Logga in – Bröllopsplaneraren" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #DFDDD4;
            --primary: #C7BDAE;
            --hover: #B4A390;
            --text-light: #997D64;
            --text-dark: #634935;
            --white: #ffffff;
            --border: #e5e3dc;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, #F5F3EE 0%, #DFDDD4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-dark);
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 40px rgba(99,73,53,0.08);
            width: 100%;
            max-width: 440px;
        }
        .btn-primary {
            background: #D4CFC4;
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            color: var(--text-dark);
        }
        .btn-primary:hover {
            background: var(--hover);
            color: white;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
        }
        .form-control:focus {
            border-color: var(--hover);
            box-shadow: 0 0 0 0.2rem rgba(180,163,144,0.25);
        }
        a {
            color: var(--text-light);
        }
        a:hover {
            color: var(--text-dark);
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--text-dark);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="{% url 'landing' %}" class="navbar-brand">
                <i class="fas fa-gem me-2"></i>{% trans "Bröllopsplaneraren" %}
            </a>
        </div>
        <h2 class="text-center mb-1">{% trans "Välkommen tillbaka" %}</h2>
        <p class="text-center text-muted small mb-4">{% trans "Logga in för att fortsätta planeringen" %}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Användarnamn" %}</label>
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Ditt användarnamn' %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Lösenord" %}</label>
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Ditt lösenord' %}" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger small">{% trans "Fel användarnamn eller lösenord." %}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary mt-2">{% trans "Logga in" %}</button>
        </form>

    </div>

</body>
</html>
