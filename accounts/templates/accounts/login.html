{% load static %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in – Bröllopsplaneraren</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage: #b5c4b1;
            --cream: #fdf7f2;
            --blush: #f2dcd8;
            --dark: #4a4a4a;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--blush) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 440px;
        }
        .btn-primary {
            background: var(--sage);
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
        }
        .btn-primary:hover { background: #9aad96; }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #e8e3df;
        }
        .form-control:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 0.2rem rgba(181,196,177,0.25);
        }
        a { color: var(--sage); }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="{% url 'landing' %}" class="text-decoration-none text-dark">
                <span class="navbar-brand">💍 Bröllopsplaneraren</span>
            </a>
        </div>
        <h2 class="text-center mb-1">Välkommen tillbaka</h2>
        <p class="text-center text-muted small mb-4">Logga in för att fortsätta planeringen</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small">Användarnamn</label>
                <input type="text" name="username" class="form-control" placeholder="Ditt användarnamn" required>
            </div>
            <div class="mb-3">
                <label class="form-label small">Lösenord</label>
                <input type="password" name="password" class="form-control" placeholder="Ditt lösenord" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger small">Fel användarnamn eller lösenord.</div>
            {% endif %}
            <button type="submit" class="btn btn-primary mt-2">Logga in</button>
        </form>

        <p class="text-center mt-4 mb-0 small">
            Inget konto? <a href="{% url 'register' %}">Skapa ett här</a>
        </p>
    </div>

</body>
</html>
