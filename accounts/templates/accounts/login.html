{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>

<script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Logga in – Bröllopsplaneraren" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --blush: #F5EBEB;
            --rose: #D4B5B5;
            --rose-dark: #B89595;
            --text: #3A3A3A;
            --text-light: #8C8C8C;
            --border: #E8E5E0;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: #F5F3EE;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text);
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
        }
        .btn-primary {
            background: var(--rose);
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: var(--rose-dark);
            transform: translateY(-2px);
            color: white;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            font-family: 'Karla', sans-serif;
        }
        .form-control:focus {
            border-color: var(--rose);
            box-shadow: 0 0 0 0.2rem rgba(212,181,181,0.25);
        }
        a {
            color: var(--rose);
            text-decoration: none;
        }
        a:hover {
            color: var(--rose-dark);
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.4rem;
            color: var(--text);
            text-decoration: none;
        }
        .text-muted {
            color: var(--text-light) !important;
        }
        .alert-danger {
            background: #F5EBEB;
            border-color: #D4B5B5;
            color: #3A3A3A;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="{% url 'landing' %}" class="navbar-brand">
                <i class="fas fa-gem me-2"></i>{% trans "Bröllopsplaneraren" %}
            </a>
        </div>
        <h2 class="text-center mb-1">{% trans "Välkommen tillbaka" %}</h2>
        <p class="text-center text-muted small mb-4">{% trans "Logga in för att fortsätta planeringen" %}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Användarnamn" %}</label>
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Ditt användarnamn' %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Lösenord" %}</label>
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Ditt lösenord' %}" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger small">{% trans "Fel användarnamn eller lösenord." %}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary mt-2">{% trans "Logga in" %}</button>
        </form>

    </div>

</body>
</html>
