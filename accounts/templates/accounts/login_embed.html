{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Logga in" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #FFFFFF;
            --light-gray: #E8E8E8;
            --gray-hover: #D0D0D0;
            --text: #222222;
            --text-light: #777777;
            --border: #E0E0E0;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            font-family: 'Cormorant Garamond', serif;
            color: var(--text);
            margin: 0;
        }
        .login-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 35px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .btn-primary {
            background: var(--light-gray);
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            color: var(--text);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            background: var(--gray-hover);
            color: var(--text);
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            font-family: 'Karla', sans-serif;
        }
        .form-control:focus {
            border-color: #999;
            box-shadow: 0 0 0 0.2rem rgba(0,0,0,0.05);
        }
        a {
            color: var(--text-light);
            text-decoration: none;
        }
        a:hover {
            color: var(--text);
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            color: var(--text);
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        .text-muted {
            color: var(--text-light) !important;
        }
        .alert-danger {
            background: #F8F8F8;
            border-color: #E0E0E0;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <a href="#" class="navbar-brand">
                <i class="fas fa-gem me-2"></i>{% trans "Logga in" %}
            </a>
        </div>
        <h2 class="text-center mb-1" style="font-size: 1.8rem;">{% trans "Välkommen tillbaka" %}</h2>
        <p class="text-center text-muted small mb-4">{% trans "Logga in för att fortsätta planeringen" %}</p>

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'dashboard' %}?embed=1">
            
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Användarnamn" %}</label>
                <input type="text" name="username" class="form-control" placeholder="{% trans 'Ditt användarnamn' %}" required>
            </div>
            <div class="mb-3">
                <label class="form-label small" style="color: var(--text-light);">{% trans "Lösenord" %}</label>
                <input type="password" name="password" class="form-control" placeholder="{% trans 'Ditt lösenord' %}" required>
            </div>
            {% if form.errors %}
                <div class="alert alert-danger small">{% trans "Fel användarnamn eller lösenord." %}</div>
            {% endif %}
            <button type="submit" class="btn btn-primary mt-2">{% trans "Logga in" %}</button>
        </form>

    </div>

</body>
</html>
