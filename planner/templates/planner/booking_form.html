{% load static %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boka tid – {{ leverantor.name }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: {{ leverantor.primary_color }};
            --accent: {{ leverantor.accent_color }};
            --text: #3D3A37;
            --text-light: #6A6662;
            --white: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Karla', sans-serif;
            {% if leverantor.background_image %}
                background: url('{{ leverantor.background_image }}') center/cover no-repeat fixed;
                background-color: var(--primary);
            {% else %}
                background: var(--primary);
            {% endif %}
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }
        body::before {
            {% if leverantor.background_image %}
                content: '';
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.35);
                z-index: 0;
            {% endif %}
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            position: relative; 
            z-index: 1; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 32px; 
            {% if leverantor.background_image %}
                color: white;
            {% endif %}
        }
        .header img { max-height: 60px; margin-bottom: 16px; }
        .header h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: 2rem; 
            {% if leverantor.background_image %}
                color: white;
            {% else %}
                color: var(--text);
            {% endif %}
        }
        .header p { 
            {% if leverantor.background_image %}
                color: rgba(255,255,255,0.8);
            {% else %}
                color: var(--text-light);
            {% endif %}
            font-size: 0.9rem; 
        }
        .card {
            background: var(--white); 
            border-radius: 16px; 
            padding: 36px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .form-group { margin-bottom: 16px; }
        label { 
            display: block; 
            font-size: 0.8rem; 
            color: var(--text-light); 
            margin-bottom: 4px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        input, select, textarea {
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid #E8E0D5;
            border-radius: 10px; 
            font-family: 'Karla', sans-serif; 
            font-size: 0.9rem;
            transition: border-color 0.3s;
            background: var(--white);
        }
        input:focus, select:focus, textarea:focus {
            outline: none; 
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200,162,107,0.1);
        }
        .btn-submit {
            width: 100%; 
            padding: 14px; 
            background: var(--accent); 
            color: white;
            border: none; 
            border-radius: 50px; 
            font-size: 0.85rem;
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            cursor: pointer;
            font-family: 'Karla', sans-serif; 
            transition: all 0.3s;
            font-weight: 400;
        }
        .btn-submit:hover { 
            filter: brightness(1.1); 
            transform: translateY(-1px);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        {% if leverantor.logo %}
            <img src="{{ leverantor.logo }}" alt="{{ leverantor.name }}">
        {% endif %}
        <h1>{% trans "Boka tid hos" %} {{ leverantor.name }}</h1>
        <p>{{ leverantor.description }}</p>
    </div>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>{% trans "Namn" %}</label>
                <input type="text" name="name" required placeholder="Ditt namn">
            </div>
            <div class="form-group">
                <label>{% trans "Email" %}</label>
                <input type="email" name="email" required placeholder="Din email">
            </div>
            <div class="form-group">
                <label>{% trans "Telefon" %}</label>
                <input type="tel" name="phone" placeholder="Ditt telefonnummer">
            </div>
            <div class="form-group">
                <label>{% trans "Typ av möte" %}</label>
                <select name="booking_type">
                    <option value="consultation">{% trans "Konsultation" %}</option>
                    <option value="visit">{% trans "Besök/Provning" %}</option>
                    <option value="call">{% trans "Videosamtal" %}</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>{% trans "Datum" %}</label>
                    <input type="date" name="date" required>
                </div>
                <div class="form-group">
                    <label>{% trans "Tid" %}</label>
                    <input type="time" name="time" required>
                </div>
            </div>
            <div class="form-group">
                <label>{% trans "Meddelande" %}</label>
                <textarea name="message" rows="3" placeholder="Vad vill du veta mer om?"></textarea>
            </div>
            <button type="submit" class="btn-submit">{% trans "Skicka bokningsförfrågan" %}</button>
        </form>
    </div>
</div>
</body>
</html>
