{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Partner Dashboard" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F3EE;
            --primary: #C7BDAE;
            --text-dark: #666666;
            --white: #ffffff;
            --border: #e5e3dc;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            overflow-x: hidden;
        }
        h1, h2, h3, h4 { font-family: 'Cormorant Garamond', serif; color: var(--text-dark); }
        .partner-nav {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .partner-nav a {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .partner-nav a:hover { background: #f5f5f5; }
        .partner-nav a.active { background: var(--primary); color: white; }
        .partner-nav .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
        .btn-primary:hover { background: #B4A390; border-color: #B4A390; }
        .table { background: var(--white); border-radius: 12px; overflow: hidden; }
        
        @media (max-width: 768px) {
            .partner-nav { flex-wrap: wrap; gap: 8px; }
            .partner-nav a { font-size: 0.8rem; padding: 6px 10px; }
        }
    </style>
</head>
<body>

<nav class="partner-nav">
    <a href="{% url 'partner_dashboard' %}" class="brand">📸 {{ fotograf.name }}</a>
    <div style="display: flex; align-items: center; gap: 8px;">
        <a href="{% url 'partner_dashboard' %}">📊 Översikt</a>
        <a href="{% url 'partner_kunder' %}">👥 Mina kunder</a>
        
        <!-- Språkväljare -->
        <form action="{% url 'set_language' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.path }}">
            <select name="language" onchange="this.form.submit()" 
                    style="font-size: 0.8rem; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--white); cursor: pointer;">
                {% get_current_language as CURRENT_LANGUAGE %}
                <option value="sv" {% if CURRENT_LANGUAGE == 'sv' %}selected{% endif %}>🇸🇪</option>
                <option value="en" {% if CURRENT_LANGUAGE == 'en' %}selected{% endif %}>🇬🇧</option>
                <option value="bs" {% if CURRENT_LANGUAGE == 'bs' %}selected{% endif %}>🇧🇦</option>
                <option value="no" {% if CURRENT_LANGUAGE == 'no' %}selected{% endif %}>🇳🇴</option>
                <option value="da" {% if CURRENT_LANGUAGE == 'da' %}selected{% endif %}>🇩🇰</option>
            </select>
        </form>
        
        <form method="post" action="{% url 'logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-danger">Logga ut</button>
        </form>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
