{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera dig som White Label-partner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Karla:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --white: #FFFFFF;
            --blush: #F5EBEB;
            --rose: #D4B5B5;
            --rose-dark: #B89595;
            --beige: #F2EFE9;
            --text: #3A3A3A;
            --text-light: #8C8C8C;
            --border: #E8E5E0;
        }
        body {
            font-family: 'Karla', sans-serif;
            background: var(--beige);
            color: var(--text);
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            color: var(--text);
        }

        /* Navbar - Exakt som landningssidan */
        .navbar-custom {
            background: var(--white);
            height: 100px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-custom a { text-decoration: none; }
        .brand-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            color: #3A3A3A;
        }
        .login-btn {
            background: var(--rose);
            color: white;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .login-btn:hover { background: var(--rose-dark); color: white; }

        /* Kort och Formulär - Exakt som landningssidans Feature Cards */
        .form-wrapper {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .form-control, .form-select {
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 12px;
            font-family: 'Karla', sans-serif;
            background: var(--white);
            font-size: 0.95rem;
            width: 100%;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--rose);
            box-shadow: 0 0 0 4px rgba(212,181,181,0.1);
        }
        .form-label { font-weight: 600; font-size: 0.95rem; }
        .form-text { font-size: 0.85rem; color: var(--text-light); }

        /* Knappar - Exakt som landningssidans .btn-primary */
        .btn-primary-custom {
            background: var(--rose);
            color: white;
            padding: 16px 38px;
            border-radius: 30px;
            font-family: 'Karla', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            border: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            width: 100%;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary-custom:hover {
            background: var(--rose-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(180,149,149,0.3);
            color: white;
        }
        
        /* Instruktionsruta (blush bakgrund) */
        .instruction-box {
            background: var(--blush);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(212,181,181,0.2);
        }
        .instruction-box ol, .instruction-box ul {
            padding-left: 20px;
            margin-top: 10px;
            color: var(--text-light);
        }
        .instruction-box a { color: var(--rose); font-weight: 600; }

        @media (max-width: 768px) {
            .navbar-custom { height: 80px; padding: 0 15px; }
            .brand-text { font-size: 1.2rem; }
            .form-wrapper { padding: 25px 15px; }
            h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- Navbar (Exakt samma som landningssidan) -->
    <nav class="navbar-custom">
        <a href="/" style="display: flex; align-items: center;">
            <img src="https://i.imgur.com/bOcT1Cx.jpeg" alt="Bröllopsplaneraren" style="height: 100px; margin-right: 8px;">
            <span class="brand-text">Bröllopsplaneraren</span>
        </a>
        <a href="{% url 'login' %}" class="login-btn">Logga in</a>
    </nav>

    <!-- Huvudbehållare -->
    <div class="container" style="margin-top: 50px; margin-bottom: 50px; max-width: 600px;">
        
        <!-- Här byts innehållet ut (Step 1, Step 2, etc) -->
        {% include step_content %}
        
    </div>

</body>
</html>
